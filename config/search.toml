[research]
schema_version = "1.0"
project = "Agent Cost Atlas"

[github]
api_base_url = "https://api.github.com"
api_version = "2026-03-10"
user_agent = "agent-cost-atlas/0.2"
per_page = 100
max_pages_per_query = 2
readme_limit = 300
search_delay_seconds = 2.2
core_delay_seconds = 0.10
timeout_seconds = 30.0
max_retries = 5

[ranking]
min_final_score = 10
query_recurrence_cap = 8
query_recurrence_weight = 3
domain_term_weight = 2
economic_term_weight = 3
forward_term_weight = 4
readme_base_score = 5
popularity_score_cap = 4
archived_penalty = 4
fork_penalty = 2

[discovery]
search_modes = ["best_match", "updated"]

[terms]
domain = ["agent", "agents", "agentic", "llm", "genai", "generative ai", "ai workflow", "multi-agent", "multi agent"]
economic = ["cost", "costs", "spend", "spending", "budget", "budgets", "billing", "finops", "price", "pricing", "economics", "unit economics"]
forward = ["forecast", "forecasting", "projected", "projection", "estimate", "estimated", "estimator", "preflight", "pre-flight", "pre run", "pre-run", "before execution", "before deployment", "confidence interval", "p95", "p90", "runway", "burn rate", "exhaustion", "reserve", "reservation", "scenario", "what-if", "what if", "gate", "gating", "quota", "limit", "tail"]

[queries]
items = [
  "ai agent cost", "ai agent costs", "ai agent budget", "ai agent spending", "ai agent finops",
  "ai agent cost governance", "ai agent cost estimation", "ai agent cost estimator", "ai agent cost forecast", "ai agent cost forecasting",
  "agentic ai cost", "agentic ai budget", "agentic ai finops", "agentic workflow cost", "agentic workflow budget",
  "agentic workflow cost estimate", "agentic workflow cost forecast", "llm agent cost", "llm agent costs", "llm agent budget",
  "llm agent spending", "llm agent cost estimator", "llm agent cost forecasting", "llm cost estimator", "llm cost estimate",
  "llm cost forecast", "llm cost forecasting", "llm budget", "llm budget guard", "llm budget control", "llm cost governance", "llm finops",
  "ai cost estimator", "ai cost forecasting", "ai cost governance", "ai finops", "preflight llm cost", "preflight agent cost",
  "pre-run agent cost", "agent cost projection", "agent spend projection", "agent budget exhaustion", "agent cost control", "agent cost gate",
  "agent budget gate", "agent cost limit", "agent cost monitoring", "agent unit economics"
]
