name: Discover open-source agent-cost projects

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-cost-atlas-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Major tags are used for the first audited run. They are replaced with
      # verified commit SHAs once the pipeline is green (see the follow-up
      # commit "ci: pin action revisions to verified commit SHAs").
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Style is advisory for the first run so that a single formatting nit
      # cannot block the first real discovery snapshot.
      - name: Lint and format check (advisory)
        continue-on-error: true
        run: |
          uvx ruff@0.16.2 check src tests
          uvx ruff@0.16.2 format --check src tests

      - name: Compile and test
        run: |
          PYTHONPATH=src python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=src python -m agent_cost_atlas discover \
            --config config/search.toml \
            --results-dir results

      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.md results/latest.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit \
            -m "chore(results): refresh discovery snapshot" \
            -m "Generated by GitHub Actions run ${GITHUB_RUN_ID} from config/search.toml at source commit ${GITHUB_SHA}."
          git push origin "HEAD:${GITHUB_REF_NAME}"
