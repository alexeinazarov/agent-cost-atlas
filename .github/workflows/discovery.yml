name: Discover open-source agent-cost projects

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-cost-atlas-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Ruff lint (advisory)
        continue-on-error: true
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.3"
          download-from-astral-mirror: "false"
          args: "check --output-format=github"
          src: >-
            src
            tests

      - name: Ruff format check (advisory)
        continue-on-error: true
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.3"
          download-from-astral-mirror: "false"
          args: "format --check --diff"
          src: >-
            src
            tests

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Run discovery
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m agent_cost_atlas discover \
            --config config/search.toml \
            --results-dir results

      - name: Verify generated snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s results/latest.json
          test -s results/latest.md

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("results/latest.json").read_text(encoding="utf-8"))

          print("=== DISCOVERY SUMMARY ===")
          print(f"Run ID: {payload.get('run_id')}")
          print(
              "Unique repositories discovered: "
              f"{payload.get('unique_repositories_discovered')}"
          )
          print(f"Candidates selected: {payload.get('readmes_analyzed')}")
          print(f"Repositories retained: {payload.get('final_count')}")
          print(f"Search result pages retrieved: {payload.get('search_requests')}")
          print(f"Inspection failures: {len(payload.get('inspection_failures', []))}")
          print("=========================")
          PY

      - name: Commit generated snapshot
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.md results/latest.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit \
            -m "data: refresh open-source discovery snapshot" \
            -m "Generated by GitHub Actions run ${GITHUB_RUN_ID} from config/search.toml at source commit ${GITHUB_SHA}."
          git push origin "HEAD:${GITHUB_REF_NAME}"
